[workspace]
members = [
    "apps/server",
    "crates/clickhouse-store",
    "crates/common",
    "crates/config",
    "crates/context",
    "crates/event",
    "crates/git-collector",
    "crates/git-context",
    "crates/git-ingest",
    "crates/k8s-context",
    "crates/k8s-collector",
    "crates/postgres-store",
    "crates/support",
    "crates/support-outbox",
]
default-members = ["apps/server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anisp-clickhouse-store = { path = "crates/clickhouse-store" }
anisp-common = { path = "crates/common" }
anisp-config = { path = "crates/config" }
anisp-context = { path = "crates/context" }
anisp-event = { path = "crates/event" }
anisp-git-collector = { path = "crates/git-collector" }
anisp-git-context = { path = "crates/git-context" }
anisp-git-ingest = { path = "crates/git-ingest" }
anisp-k8s-context = { path = "crates/k8s-context" }
anisp-k8s-collector = { path = "crates/k8s-collector" }
anisp-postgres-store = { path = "crates/postgres-store" }
anisp-support = { path = "crates/support" }
anisp-support-outbox = { path = "crates/support-outbox" }
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["clock", "serde"] }
clickhouse = { version = "0.13.3", features = ["chrono", "uuid"] }
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
kube = { version = "2.0", default-features = false, features = ["client", "rustls-tls", "ring"] }
k8s-openapi = { version = "0.26", features = ["v1_34"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "uuid"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
